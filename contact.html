<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rapka Website - Contact</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* BACKGROUND */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* NAVBAR */
        nav {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            opacity: 0.7;
            transition: 0.3s;
        }

        nav a:hover {
            opacity: 1;
            color: #ffd369;
        }

        /* CARD */
        .container {
            max-width: 500px;
            margin: auto;
            margin-top: 60px;
            margin-bottom: 60px;
            padding: 40px;
            border-radius: 20px;

            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(18px);

            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* FORM */
        label {
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            margin-bottom: 18px;
            border-radius: 12px;
            border: none;
            outline: none;

            background: rgba(255,255,255,0.9);
            transition: 0.25s ease;
        }

        input:focus, textarea:focus {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* BUTTON */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* SUCCESS MESSAGE */
        .success {
            margin-top: 15px;
            text-align: center;
            color: #fff;
            font-size: 0.9rem;
            opacity: 0;
            transition: 0.4s;
        }

        .success.show {
            opacity: 1;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.8);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="Hitam dan Emas Modern Profesional Lulusan Baru Resume.pdf">Download CV</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
    </nav>

    <div class="container">
        <h1>📩 Contact Me</h1>

        <form id="contactForm">
            <label>Email</label>
            <input type="email" placeholder="Masukkan email..." required>

            <label>Pesan</label>
            <textarea rows="4" placeholder="Tulis pesan..." required></textarea>

            <button type="submit" class="btn-submit">Kirim Pesan 🚀</button>

            <div class="success" id="successMsg">
                ✅ Pesan berhasil dikirim!
            </div>
        </form>
    </div>

    <footer>
        © 2026 Izzz Website | Dibuat dengan ❤️
    </footer>

    <script>
        const form = document.getElementById('contactForm');
        const success = document.getElementById('successMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            success.classList.add('show');

            setTimeout(() => {
                success.classList.remove('show');
                form.reset();
            }, 2500);
        });
    </script>

</body>
</html>
